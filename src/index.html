<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meridian — Analytics Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meridian — an open-source, self-hosted analytics console for SaaS teams.">
  <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="brand/mark.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Set the theme before first paint to avoid a flash of the wrong palette. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('meridian-theme');
        var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', stored || system);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
